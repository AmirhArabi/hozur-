name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 with npm cache
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Set up Java JDK 21 (Temurin)
      # Note: Capacitor 7 and 8 require Java 21 / Android SDK 35.
      # (If using Capacitor 6, JDK 17 should be used instead).
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 4: Install npm dependencies using clean install
      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # Step 5: Run unit tests for calculation and Jalali calendar logic
      - name: Run unit tests
        run: npm test

      # Step 6: Build the web application (Vite production build into dist/)
      - name: Build Web App
        run: npm run build

      # Step 7: Initialize Android platform if not present and sync web assets
      - name: Setup and sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform directory not found, adding Capacitor Android..."
            npx cap add android
          fi
          npx cap sync android

      # Step 8: Grant execute permissions for gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Step 9: Build Debug APK with Gradle
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      # Step 10: Upload the generated APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
