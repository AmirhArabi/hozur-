name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 with npm cache
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Set up Java JDK 21 (Temurin)
      # Note: Capacitor 7 and 8 require Java 21 / Android SDK 35.
      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 4: Install npm dependencies using clean install
      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # Step 5: Run unit tests for calculation and Jalali calendar logic
      - name: Run unit tests
        run: npm test

      # Step 6: Build the web application (Vite production build into dist/)
      - name: Build Web App
        run: npm run build

      # Step 7: Initialize Android platform if not present, generate icons, and sync web assets
      - name: Setup and sync Capacitor Android with custom icons
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform directory not found, adding Capacitor Android..."
            npx cap add android
          fi
          # Generate custom launcher icons from assets/icon.png
          npx @capacitor/assets generate --android || true
          npx cap sync android

      # Step 8: Grant execute permissions for gradlew and create custom keystore
      - name: Prepare Signing Keystore
        run: |
          chmod +x android/gradlew
          # Generate custom dedicated release keystore for hozur
          keytool -genkey -v -keystore hozur.keystore -alias hozur \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hozurpassword -keypass hozurpassword \
            -dname "CN=hozur, OU=hozur, O=hozur, L=Tehran, ST=Tehran, C=IR"

      # Step 9: Build Android Release APK with Gradle
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      # Step 10: Sign and Align APK with v2/v3 signatures to prevent untrusted source / Play Protect warnings
      - name: Sign APK with apksigner (v2 & v3 schemes)
        run: |
          # Locate built APK
          BUILT_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found built APK: $BUILT_APK"
          
          # Find Android SDK build-tools
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"
          
          # Align APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$BUILT_APK" hozur-aligned.apk || cp "$BUILT_APK" hozur-aligned.apk
          
          # Sign APK with v2 and v3 signatures
          $BUILD_TOOLS_DIR/apksigner sign --ks hozur.keystore --ks-pass pass:hozurpassword \
            --ks-key-alias hozur --key-pass pass:hozurpassword \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out hozur-release.apk hozur-aligned.apk
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify --verbose hozur-release.apk

      # Step 11: Upload the signed APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hozur-release-apk
          path: hozur-release.apk
          if-no-files-found: error
          retention-days: 14
